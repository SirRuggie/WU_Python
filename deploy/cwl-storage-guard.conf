[Unit]
# Retry even if the data volume is temporarily unavailable during startup.
StartLimitIntervalSec=0

[Service]
ExecStartPre=/usr/bin/mountpoint -q /nvme0n1-disk
# Never silently initialize a replacement database after storage loss.
ExecStartPre=/usr/bin/test -s ${CWL_WEB_DB_PATH}
RestartSec=10
